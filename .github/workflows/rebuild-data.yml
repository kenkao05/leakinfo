name: Rebuild leaks.json

on:
  push:
    branches: [main]
    paths:
      - "india_exam_leaks_master.csv"

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate leaks.json
        run: python3 prep_data.py

      - name: Commit updated data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/leaks.json
          git diff --staged --quiet || git commit -m "Regenerate leaks.json from updated CSV"
          git push
