name: Exam leak sweep

on:
  schedule:
    - cron: "0 6 1,15 * *" # 6am UTC on the 1st and 15th of each month
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run sweep
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/sweep_leaks.py

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Automated leak sweep: candidate incidents"
          branch: automated/leak-sweep
          delete-branch: true
          title: "Automated exam leak sweep — new candidate incidents"
          body: |
            Opened automatically by the leak-sweep workflow.

            - Review each new row in `india_exam_leaks_master.csv` against its `source_url` before merging.
            - Check `pending_review.csv` for rows flagged for manual attention (low confidence, or involving arrests/convictions/deaths).
            - If nothing changed, this PR will be empty — safe to close.
